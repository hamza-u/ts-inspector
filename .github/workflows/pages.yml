name: pages

# Builds the MIT-only page (python3 build.py --no-gpl) and publishes it to
# GitHub Pages. The full build embeds GPL programs and weighs about 44 MB, so
# it is not published here. See README, License.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build.py runs `node --check` on the generated scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test test
      - run: python3 build.py --no-gpl
      - run: mkdir -p site && cp dist/ts-inspector.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
